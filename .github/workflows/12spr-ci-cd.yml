
name: Sprint 12 CI/CD Pipeline for Go
on:
    push:
        branches: [ "**" ]
        tags: [ "v*" ]
        paths-ignore:
          - 'README.md'

jobs:
  # ЭТАП №1 (CI): Тестирование и линтинг
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository code
              uses: actions/checkout@v4

            - name: Setup Go environment
              uses: actions/setup-go@v5
              with:
                go-version: '1.24'
                cache: true

            - name: Fetch Dependencies
              run: go mod download
            
            - name: Run Go Vet (Linting)
              run: go vet ./...

            - name: Run unit tests
              run: go test -v -race -timeout 30s ./...

# ЭТАП №2 (CD): Сборка и отправка Docker-image в Docker Hub
    build-and-push:
        runs-on: ubuntu-latest
        needs: test       
        # Ограничение запуска джобы только командом push Git-тегов, начинающихся на 'v'
        if: startsWith(github.ref, 'refs/tags/v')

        steps:
          - name: Checkout repository code
            uses: actions/checkout@v4

          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }} 
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Test Docker Login
            run: docker info        
          
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build Docker Image
            run: docker build -t test-image .

          - name: Extract metadata (tags, labels) for Docker
            id: meta
            uses: docker/metadata-action@v5.5.1
            with:
              images: ${{ secrets.DOCKERHUB_USERNAME }}/12spr-ci-cd-igor01

          - name: Build and Push Docker Image
            uses: docker/build-push-action@v5
            with:
              context: .
              file: ./Dockerfile
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels}}

